[package]
name = "ikigai-toolbox"
version = "0.2.1"
edition = "2021"
# Probed 2026-10-19: 1.86 fails in ikigai-core (`usize::is_multiple_of`, stable in 1.87);
# 1.87 builds the lib and every test target. The shared CI's msrv job holds it there.
rust-version = "1.87"
# MSRV-aware resolution (cargo's resolver 3): each dependency's newest version that
# still builds on `rust-version`, since CI commits no lockfile.
resolver = "3"
license = "MIT OR Apache-2.0"
description = "The RDF Toolbox (turtle-lsp in the browser) served as ikigai resources: urn:toolbox:* names over a host's own build of the page, for Validate, Format, SHACL and SPARQL over the host's Turtle."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-toolbox"
homepage = "https://github.com/ikigai-rs/ikigai-toolbox"
readme = "README.md"
keywords = ["ikigai", "roc", "rdf", "shacl", "module"]
categories = ["wasm", "web-programming"]
# The package is the crate: the vendored source, the build output, our patches to
# it and the tests (whose fixtures are build output) are the repo's, never the crate's.
exclude = ["/vendor", "/dist", "/patches", "/tests", "/web", "/tools", "/build.sh", "/.github", "/.gitmodules"]

[dependencies]
# The released kernel, the SAME one the hosts use, so a host links one ikigai-core.
# 0.2.0 is the streams release (ledger #2261). The old 0.1 pin meant
# <0.2.0 under 0.x caret rules.
ikigai-core = "0.2.0"
# The views are ikigai-fn `composeOver` over the page template (named instances,
# 0.3.1), and `urn:toolbox:text:{text}` is its `echo`. 0.5.0 is the floor for the
# escaping the page relies on: `$h` per FND-H's rule set, C0 controls to U+FFFD, and
# an argument spliced into a marker IRI percent-encoded as one segment (ledger #1813).
# 0.7.0 carries these endpoints onto core 0.2.0.
ikigai-fn = "0.7.0"
# `Endpoint` is an async-trait trait; the file reader implements it for its body path.
async-trait = "0.1"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (tests/conformance.rs), at the current minor.
ikigai-conformance = "0.12.0"
# The manifest's Turtle face: ikigai-rdf's `urn:rdf:transrept` is the transreptor that
# reaches text/turtle from application/ld+json (ikigai-jsonld's operators are
# JSON-LD-to-JSON-LD transformations, not transreptors).
ikigai-rdf = "0.3.0"
# The README's host: ikigai-fs's FileEndpoint over a build directory (tests/host.rs).
# 0.2.2's file Source answers a seekable `Replay` (tests/bodies.rs's large input).
ikigai-fs = "0.2.2"
